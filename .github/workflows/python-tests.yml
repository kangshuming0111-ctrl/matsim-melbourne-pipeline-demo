name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install product dependencies
        run: python -m pip install -r requirements.txt -r requirements-analytics.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
